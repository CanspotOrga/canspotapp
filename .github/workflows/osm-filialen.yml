# Filialen aus OpenStreetMap alle 4 Monate aktualisieren.
# Läuft am 1. Januar, 1. Mai und 1. September um 05:00 UTC (6/7 Uhr deutscher
# Zeit) oder von Hand über "Run workflow":
# fragt Overpass einmal ab (supabase/import/osm-filialen.py) und committet
# supabase/data/branches-osm.json, wenn sich etwas geändert hat.
# Die Datenbank übernimmt die Datei am selben Tag um 10 Uhr deutscher Zeit per
# pg_cron, prüft dabei die Sicherheitsschranke (unter 90 % der bisherigen
# Filialen: Abbruch) und schickt eine Info an hallo@canspot.de
# (supabase/sql/sql-osm-aktualisierung.sql).
name: OSM-Filialen alle 4 Monate

on:
  schedule:
    - cron: "0 5 1 1,5,9 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-filialen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Overpass abfragen
        run: python3 supabase/import/osm-filialen.py --output /tmp/branches-osm.json

      # Grobe Prüfung; die 90-%-Schranke mit Mail macht die Datenbank.
      - name: Datei prüfen
        run: |
          python3 - <<'EOF'
          import json, sys
          new = json.load(open("/tmp/branches-osm.json"))
          n = new["count"]
          print(f"{n} Filialen")
          if n < 1000 or len(new["branches"]) != n:
              sys.exit(f"Abbruch: Datei unvollständig ({n} Filialen), wird nicht übernommen.")
          EOF
          cp /tmp/branches-osm.json supabase/data/branches-osm.json

      - name: Committen, wenn geändert
        run: |
          if git diff --quiet -- supabase/data/branches-osm.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "CanSpot OSM-Import"
          git config user.email "noreply@canspot.de"
          git add supabase/data/branches-osm.json
          git commit -m "Filialen aus OpenStreetMap aktualisiert ($(date -u +%Y-%m-%d))"
          git pull --no-rebase origin main
          git push origin HEAD:main
